<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="css/generalstyles.css">
        <link rel="stylesheet" href="css/style.css">
        <style>
            body {
                color: greenyellow;
            }

            .frame {
                border: 2px solid greenyellow;
                margin: auto;
                margin-top: 125px;
                width: 502px;
                height: 650px;
            }

            .num-holder {
                display: flex;
                border: 2px solid greenyellow;
                height: 100px;
                width: 500px;
                margin-top: 50px;
                font-size: 50px;
            }

            .numbs {
                display: grid;
                grid-template-columns: repeat(4, 110px);
                column-gap: 10px;
                gap: 12px;
                color: greenyellow;
                width: 450px;
                height: 280px;
                margin-top: 25px;
                margin-left: 10px;
            }

            .num,.math {
                background-color: black;
                color: greenyellow;
                border: 1px solid greenyellow;
                height: 80px;
                width: 80px;
                font-size: 30px;
                cursor: pointer;
            }

            .num:hover {
                box-shadow: 0 0 12px greenyellow;
            }

            .math:hover {
                box-shadow: 0 0 12px greenyellow;
            }
        </style>
    </head>
    <body>

        <header>
            <h1>Calculator</h1>
            <a href="index.html" class="home-link">Home</a>
        </header>
                
        <div class="frame">
            <div id="console" class="num-holder"></div>
            <div class="numbs" >
                <button class="num" onclick="number('');">C</button>
                <button class="num" onclick="number(' () ');">()</button>
                <button class="num" onclick="number(' / ');">÷</button>
                <button class="num" onclick="number(' % ');">%</button>
                <button class="num" onclick="number('1');">1</button>
                <button class="num" onclick="number(2);">2</button>
                <button class="num" onclick="number(3);">3</button>
                <button class="math" onclick="number(' - ');">-</button>
                <button class="num" onclick="number(4);">4</button>
                <button class="num" onclick="number(5);">5</button>
                <button class="num" onclick="number(6);">6</button>
                <button class="math" onclick="number(' * ');">x</button>
                <button class="num" onclick="number(7);">7</button>
                <button class="num" onclick="number(8);">8</button>
                <button class="num" onclick="number(9);">9</button>
                <button class="math" onclick="number(' + ');">+</button>
                <button class="num" onclick="number('.');">.</button>
                <button class="num" onclick="number(0);">0</button>
                <button class="num" onclick="number('.');">T</button>
                <button class="math" onclick="number(' = ');">=</button>
            </div>
        </div>
        <script>
        let calculation = "";

        let jsCalcNumbs = document.querySelector('.num-holder');

        function number(num) {
            if (num === '') {
                calculation = "";
            } else if (num === ' = ') {
                try {
                    calculation = eval(calculation).toString();
                    jsCalcNumbs.innerHTML = calculation;
                    calculation = "";
                    return;
                    
                } catch {
                    calculation = "Error";
                    console.log(calculation);
                    calculation = "";
                    return;
                }
            } else {
                calculation += num;
            }

            jsCalcNumbs.innerHTML = calculation;
            return;
        }
        </script>
    </body>
</html>
