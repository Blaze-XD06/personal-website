<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss</title>
    <style>
        body {
            background-color: black;
            color: greenyellow;
        }
        
        header {
            display: flex;
            justify-content: center;
        }

        main {
            display: flex;
            justify-content: center;
        }

        button {
            display: flex;
            justify-content: center;
            border: solid 2px greenyellow;
            border-radius: 10px;
            background-color: black;
            color: greenyellow;
            padding: 10px;
            margin-left: 10px;
        }

        button:hover {
            box-shadow: 0 0 12px greenyellow;
        }

        .js-score {
            height: 100px;
            width: 250px;
            border: solid 2px greenyellow;
            margin: 10px auto;
        }

        .js-wins,.js-losses,.js-outcome {
            margin: 0px;
            border: solid 2px greenyellow;
            width: 250px;
            height: 30px;
        } 
    </style>
</head>
<body>
    <header><h1>Coin Toss</h1></header>
    <main>
        <button onclick="
            coinToss('Heads');">Heads</button>
        <button onclick="
        coinToss('Tails');">Tails</button>
        <button onclick="
        reset();">Reset score</button>
    </main>

    <div class="js-score">
        <p class="js-wins"></p>
        <p class="js-losses"></p>
        <p class="js-outcome"></p>
    </div>

    <script>
        const result = localStorage.getItem('coinTossResult') ? JSON.parse(localStorage.getItem('coinTossResult')) : {
            wins:0,
            losses:0,
        };

        function coinToss (face) {
            const pc = Math.random();
            let choice = '';

            const jsWins = document.querySelector('js-wins');
            const jsLosses = document.querySelector('js-losses');
            const jsOutcome = document.querySelector('js-Outcome');

            if (pc > 0.5) {
                choice = 'Heads';
            } else if (pc < 0.5) {
                choice = 'Tails';
            }

            if (face === choice) {
                result.wins += 1;
            } else {
                result.losses += 1;
            }

            jsWins.innerHTML = result.wins;
            jsLosses.innerHTML = result.losses; 
            jsOutcome.innerHTML = `You choice ${choice} and Pc choice ${pc} `; 

            localStorage.setItem('coinTossResult', JSON.stringify(result));

        }

        function reset () {
            result.wins = 0;
            result.losses = 0;
            console.log(`Score reset. wins:${result.wins} losses:${result.losses}`);
        }
    </script>
</body>
</html>
