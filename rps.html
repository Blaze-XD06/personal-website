<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>rps</title>
        <style>
            body {
                font-family: arial;
                background-color: black;
                color: greenyellow;
            }

            .main-heading {
                display: flex;
                justify-content: center;
            }

            button {
                font-size: 15px;
                background-color: black;
                color: greenyellow;
                border:2px solid greenyellow;
                border-radius: 10px;
                cursor: pointer;
                height: 40px;
                width: 100px;
                margin-bottom: 10px;
            }

            .button-main {
                width: 300px;
                height: 150px;
                margin-left: 50px;
            }

            .buttons {
                display: flex;
                justify-content: center;
                margin-top: 50px;
                margin-left: 90px;
            }

            .js-score,.js-result,.js-moves {
                width: 500px;
                padding: 5px;
                border: 2px solid greenyellow;
                color: greenyellow;
                margin: 0px auto;
            }

            .js-result {
                height: 20px;
            }
        </style>
    </head>
    <body>
        <div class="main-heading"><h1k>Rock Paper Scissors</h1></div>
        <main class="buttons">
            <div class="button-main">
                <button onclick="
                playGame('🪨');
                ">🪨</button>

            </div>
                
            <div class="button-main">
                <button onclick="
                 playGame('📄');
                ">📄</button>

            </div>
            <div class="button-main">
                <button onclick="
                playGame('✂️');
                ">✂️</button>
            </div>

            </div>
            <div class="button-main">
                <button onclick="
                score.wins = 0;
                score.losses = 0;
                score.ties = 0;
                localStorage.removeItem('score');
                updateScoreElement();
                document.querySelector('.js-result').innerHTML = '';
                document.querySelector('.js-moves').innerHTML = 'Waiting for a move';
                ">Reset Score</button>
            </div>

        </main>
        
        <section>
            <p class="js-score"></p>
            <p class="js-moves">Waiting for move</p>
            <p class="js-result"></p>
        </section>
 
        

        <script>
            let score = JSON.parse(localStorage.getItem('score')) || {
                wins:0,
                losses:0,
                ties:0
            };

            updateScoreElement();

            console.log();

            function playGame(playerMove) {
                const computerMove = pickComputerMove();

                let result = '';

                if (playerMove === '✂️') {
                  if (computerMove === '✂️') {
                result = 'Tie.';
                } else if (computerMove === '🪨') {
                    result = 'You Lose!';
                } else if (computerMove === '📄') {
                    result = 'You win!';
                }

                } else if (playerMove === '📄') {
                  if (computerMove === '📄') {
                result = 'Tie.';
                } else if (computerMove === '✂️') {
                    result = 'You Lose!';
                } else if (computerMove === '🪨') {
                    result = 'You win!';
                }

                } else if (playerMove === '🪨') {
                  if (computerMove === '🪨') {
                result = 'Tie.';
                } else if (computerMove === '📄') {
                    result = 'You Lose!';
                } else if (computerMove === '✂️') {
                    result = 'You win!';
                }
                
                }

                if (result === 'You win!') {
                    score.wins += 1;
                } else if (result === 'You Lose!') {
                    score.losses += 1;
                } else if (result === 'Tie.') {
                    score.ties += 1;
                }

                localStorage.setItem('score', JSON.stringify(score));

                updateScoreElement();

                document.querySelector('.js-result').
                innerHTML = result;

                document.querySelector('.js-moves').innerHTML 
                = `You picked ${playerMove}. Computer picked ${computerMove}.`;
            }

            function updateScoreElement() {
                document.querySelector('.js-score')
            .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
            }

            function pickComputerMove() {
            const randomNumber = Math.random();

            let computerMove = '';

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = '🪨';
            } else if (randomNumber >= 1 /3 && randomNumber < 2 / 3) {
                computerMove = '📄';
            } else if (randomNumber >= 2/3 && randomNumber < 1) {
                computerMove = '✂️';
            }

            return computerMove;
            }
        </script>
    </body>
</html>
